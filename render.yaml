# =============================================================================
# Blueprint do ambiente de testes hospedado.
#
# A API roda como processo contínuo, não como função serverless — é o que
# permite WebSocket (Fase 3) e workers de fila (Fase 6) funcionarem sem
# reescrita. O Redis já entra aqui para que a Fase 6 não precise de mudança de
# infraestrutura.
#
# A interface fica na Vercel; só a API e os serviços de dados vivem aqui.
#
# O nome do serviço define a URL (https://<name>.onrender.com) e precisa bater
# com o VITE_API_URL configurado na Vercel.
# =============================================================================

# O Postgres é o do Supabase, não um banco gerenciado aqui — o Postgres gratuito
# do Render é removido após 30 dias, o que faria o ambiente de testes evaporar no
# meio do desenvolvimento.

services:
  - type: web
    name: wpp-coexistencia
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # O Render injeta PORT e espera que o processo escute nela.
      - key: API_PORT
        value: 3333

      # Supabase. DATABASE_URL usa o pooler (6543); DIRECT_URL, a conexão
      # direta (5432), necessária para o `prisma migrate deploy` da subida.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      - key: REDIS_URL
        fromService:
          type: redis
          name: wpp-coexistencia-redis
          property: connectionString

      # Gerado automaticamente na criação e preservado depois.
      # Trocar JWT_SECRET derruba todas as sessões ativas.
      - key: JWT_SECRET
        generateValue: true

      # Precisa ser informada à mão e GUARDADA: perdê-la torna ilegíveis a
      # senha do SMTP e os System User Tokens da Meta já salvos.
      - key: ENCRYPTION_KEY
        sync: false

      # URL da interface na Vercel. Sem CORS_ORIGINS correto o navegador
      # bloqueia as requisições mesmo com a API no ar.
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # URL desta própria API, usada nos links de mídia.
      - key: PUBLIC_API_URL
        sync: false

      # Interface e API em domínios diferentes neste ambiente: o cookie do
      # refresh token precisa de SameSite=None; Secure.
      - key: COOKIE_CROSS_SITE
        value: "true"

      # Meta / WhatsApp Cloud API.
      - key: META_GRAPH_VERSION
        value: v25.0
      # App Secret: valida a assinatura de todo webhook recebido.
      - key: META_APP_SECRET
        sync: false
      # Token combinado com a Meta ao cadastrar a URL do webhook.
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false

      # SMTP: configurável pela interface. Estes valores servem apenas para o
      # primeiro convite, antes de existir configuração salva no banco.
      - key: SMTP_HOST
        sync: false
      # Use a porta STARTTLS do provedor (587 na Resend, no Brevo e no Gmail).
      # A 465 é TLS implícito e exige SMTP_SECURE=true.
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: Atendimento

  - type: redis
    name: wpp-coexistencia-redis
    plan: free
    region: oregon
    ipAllowList: []
